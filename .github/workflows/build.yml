name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Linux: системные библиотеки для окна (X11), OpenGL и аудио (ALSA)
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev pkg-config

      - name: Build (release)
        run: cargo build --release --locked

      # Smoke-тест: игра сама кликает, покупает, сохраняется и выходит с SMOKE OK
      - name: Smoke test (headless Linux)
        if: runner.os == 'Linux'
        run: |
          export STELLAR_NO_AUDIO=1
          xvfb-run -a ./target/release/stellar-scavenger &
          PID=$!
          sleep 45
          kill $PID 2>/dev/null || true
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stellar-scavenger-${{ matrix.os }}
          path: |
            target/release/stellar-scavenger
            target/release/stellar-scavenger.exe
          if-no-files-found: ignore
